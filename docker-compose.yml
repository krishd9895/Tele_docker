networks:
  bot-net:
    driver: bridge

services:
  tg-manager-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_manager_bot
    restart: always
    network_mode: host
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    environment:
      # ── Core ──────────────────────────────────────────────────────────────
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
      - SECRET_ADMIN_PASSWORD=${SECRET_ADMIN_PASSWORD:-}
      - MONGO_URI=${MONGO_URI:-}
      - DB_PATH=${DB_PATH:-data/manager.db}
      - DEPLOYMENT_TIMEOUT=${DEPLOYMENT_TIMEOUT:-600}

      # ── Security ──────────────────────────────────────────────────────────
      - TOTP_SECRET=${TOTP_SECRET:-}

      # ── Host SSH Bridge ───────────────────────────────────────────────────
      - HOST_SSH_USER=${HOST_SSH_USER:-}
      - HOST_SSH_PASSWORD=${HOST_SSH_PASSWORD:-}

      # ── Git scanning ──────────────────────────────────────────────────────
      - GIT_SCAN_PATHS=${GIT_SCAN_PATHS:-}

      # ── DuckDNS ───────────────────────────────────────────────────────────
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-}
      - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-}
      - DUCKDNS_UPDATE_INTERVAL=${DUCKDNS_UPDATE_INTERVAL:-300}

      # ── zrok2 ─────────────────────────────────────────────────────────────
      - ZROK_BINARY=${ZROK_BINARY:-zrok2}
      - ZROK_PRIVATE_TOKEN=${ZROK_PRIVATE_TOKEN:-}
      - ZROK_API_ENDPOINT=${ZROK_API_ENDPOINT:-http://127.0.0.1:18080}
      - ZROK_ACCOUNT_EMAIL=${ZROK_ACCOUNT_EMAIL:-admin@tele.local}
      - ZROK_ACCOUNT_PASSWORD=${ZROK_ACCOUNT_PASSWORD:-changeme123}

      # ── zrok2 Bootstrap (optional — only used by /zrok_bootstrap command) ─
      - ZROK2_DNS_ZONE=${ZROK2_DNS_ZONE:-}
      - ZITI_ADMIN_PASSWORD=${ZITI_ADMIN_PASSWORD:-}
      - ZITI_API_ENDPOINT=${ZITI_API_ENDPOINT:-https://127.0.0.1:1280}
      - ZROK2_TLS_CERT=${ZROK2_TLS_CERT:-}
      - ZROK2_TLS_KEY=${ZROK2_TLS_KEY:-}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0) if os.path.exists('/app/data/healthy') else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  tg-rescue-bot:
    build:
      context: .
      dockerfile: Dockerfile.rescue
    container_name: tg_rescue_bot
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${RESCUE_BOT_TOKEN:-}
      - ALLOWED_USER_ID=${ALLOWED_USER_ID}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
